[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysentra"
version = "0.1.0"
description = "Local-first, authorized-use web app security scanner with a live vulnerability dashboard"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "pysentra contributors"}]
keywords = ["security", "vulnerability-scanner", "pentest", "owasp", "web-security", "dashboard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["requests>=2.31", "flask>=3.0", "rich>=13.0", "jinja2>=3.1", "cryptography>=42.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
headless = ["playwright>=1.40"]
dev = ["pytest>=7", "build>=1", "twine>=5"]

[project.urls]
Homepage = "https://github.com/Sanjiv215/PySentra"
Repository = "https://github.com/Sanjiv215/PySentra"
Issues = "https://github.com/Sanjiv215/PySentra/issues"

[project.scripts]
pysentra = "pysentra.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
pysentra = ["dashboard/templates/*.html", "dashboard/static/*", "report/templates/*.j2"]

[tool.setuptools.data-files]
"demo-vulnerable-app" = ["demo-vulnerable-app/app.py", "demo-vulnerable-app/requirements.txt"]
"demo-vulnerable-app/static" = ["demo-vulnerable-app/static/app.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysentra"
version = "1.2.0"
description = "Local-first, authorized-use web app & universal code security scanner with a live vulnerability dashboard"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{name = "Sanjiv Prasad", email = "sanjivprasad360@gmail.com"}]
keywords = ["security", "vulnerability-scanner", "static-analysis", "secrets-detection", "sast", "dast", "pentest", "owasp", "web-security", "dashboard"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "requests>=2.31",
  "flask>=3.0",
  "rich>=13.0",
  "jinja2>=3.1",
  "cryptography>=42.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
headless = ["playwright>=1.40"]
dev = [
  "pytest>=7",
  "build>=1",
  "twine>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/Sanjiv215/PySentra"
Repository = "https://github.com/Sanjiv215/PySentra"
Issues = "https://github.com/Sanjiv215/PySentra/issues"

[project.scripts]
pysentra = "pysentra.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
pysentra = ["py.typed", "dashboard/templates/*.html", "dashboard/static/*", "report/templates/*.j2"]

[tool.setuptools.data-files]
"demo-vulnerable-app" = ["demo-vulnerable-app/app.py", "demo-vulnerable-app/requirements.txt"]
"demo-vulnerable-app/static" = ["demo-vulnerable-app/static/app.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
